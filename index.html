<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win Challenge Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Subtle animated background canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Confetti canvas (sits on top for effects) -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ════ LOADING ════ -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Connecting...</p>
  </div>

  <!-- ════ LAUNCH COUNTDOWN OVERLAY ════ -->
  <div id="launch-overlay">
    <div class="launch-card">
      <p class="launch-eyebrow">Something is coming</p>
      <h2 class="launch-title">WIN CHALLENGE</h2>
      <p class="launch-sub" id="launch-sub">Challenge starts in</p>
      <div class="launch-countdown">
        <div class="cd-seg"><span id="cd-days">--</span><span class="cd-label">days</span></div>
        <span class="cd-colon">:</span>
        <div class="cd-seg"><span id="cd-hours">--</span><span class="cd-label">hours</span></div>
        <span class="cd-colon">:</span>
        <div class="cd-seg"><span id="cd-mins">--</span><span class="cd-label">min</span></div>
        <span class="cd-colon">:</span>
        <div class="cd-seg"><span id="cd-secs">--</span><span class="cd-label">sec</span></div>
      </div>
      <div class="launch-pw-section">
        <p class="launch-pw-label">Have early access? Enter password:</p>
        <div class="pw-input-row">
          <input id="viewer-pw-input" type="password" class="pw-input" placeholder="Password..."
                 onkeydown="if(event.key==='Enter') checkViewerPassword()" />
          <button class="btn btn-launch" onclick="checkViewerPassword()">GO!</button>
        </div>
        <p id="viewer-pw-error" class="pw-error"></p>
      </div>
    </div>
  </div>

  <!-- ════ MAIN CONTENT ════ -->
  <div id="main-content">

    <header>
      <div class="viewer-badge"><span class="pulse-dot"></span>Live Viewer</div>
      <h1 class="brand" id="brand-logo" onclick="secretAdminClick()">Win Challenge</h1>
      <p class="subtitle">Track every victory</p>
    </header>

    <!-- Challenge countdown timer -->
    <div class="timer-card">
      <p class="timer-label">⏱ Remaining Time</p>
      <div id="timer-display">--:--:--</div>
      <div class="timer-status">
        <span class="pulse-dot"></span>
        <span id="timer-subline">Connecting…</span>
      </div>
    </div>

    <!-- Total time spent -->
    <div class="total-time-card">
      <span class="total-time-label">Time spent on Tasks</span>
      <span id="total-time-display" class="total-time-value">00:00:00</span>
    </div>

    <!-- Checklist -->
    <div class="checklist-card">
      <div class="checklist-header">
        <span class="checklist-title">Tasks</span>
        <span id="progress-text" class="progress-text">0 / 0</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progress-fill" class="progress-bar-fill" style="width:0%"></div>
      </div>
      <ul id="task-list" class="task-list"></ul>
    </div>

    <div class="status-bar">
      <span class="status-badge"><span class="pulse-dot"></span>Read-only view</span>
      <button class="btn-mini" onclick="openMiniMode()">Pop Out</button>
    </div>

  </div>

  <div id="toast" class="toast"></div>
  <!-- Tooltip element (shared, moved by JS) -->
  <div id="tooltip" class="tooltip"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase.js"></script>
  <script src="app.js"></script>
  <script src="feature-viewer-count.js"></script> <!-- New -->
  <script src="feature-darkmode.js"></script>    <!-- New -->
  <script src="feature-reactions.js"></script> <!-- New -->
  <script>
    let _clicks = 0, _clickTimer;
    function secretAdminClick() {
      _clicks++;
      clearTimeout(_clickTimer);
      if (_clicks >= 3) { _clicks = 0; window.location.href = "admin.html"; }
      else _clickTimer = setTimeout(() => { _clicks = 0; }, 1500);
    }
  </script>
</body>
</html>
